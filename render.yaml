services:
  - type: web
    name: newspulse-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ADMIN_USERNAME
        value: admin
      - key: APP_ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://newspulse-olive.vercel.app
