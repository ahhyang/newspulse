services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newspulse
      POSTGRES_USER: newspulse
      POSTGRES_PASSWORD: newspulse
    ports:
      - "5432:5432"
    volumes:
      - newspulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newspulse -d newspulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/newspulse
      SPRING_DATASOURCE_USERNAME: newspulse
      SPRING_DATASOURCE_PASSWORD: newspulse
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     - api

volumes:
  newspulse_pgdata:
