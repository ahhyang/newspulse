spring:
  application:
    name: newspulse-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 16
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  ingestion:
    enabled: ${INGESTION_ENABLED:true}
    interval-ms: ${INGESTION_INTERVAL_MS:3600000}
    initial-delay-ms: ${INGESTION_INITIAL_DELAY_MS:20000}
    lookback-hours: ${INGESTION_LOOKBACK_HOURS:24}
  llm:
    provider: openrouter
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:anthropic/claude-3.5-sonnet}
    http-referer: ${OPENROUTER_HTTP_REFERER:https://github.com/ahhyang/newspulse}
    app-title: NewsPulse
  gnews:
    enabled: ${GNEWS_ENABLED:true}
    api-key: ${GNEWS_API_KEY:}
    base-url: ${GNEWS_BASE_URL:https://gnews.io/api/v4}
    lang: ${GNEWS_LANG:en}
    max-results: ${GNEWS_MAX_RESULTS:10}
