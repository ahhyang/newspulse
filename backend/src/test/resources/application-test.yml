spring:
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: test-jwt-secret-key-that-is-long-enough-for-hs256-algorithms
    expiration-ms: 3600000
  admin:
    username: admin
    password: test-password
  cors:
    allowed-origins: http://localhost:5173
  ingestion:
    enabled: false
    interval-ms: 3600000
    initial-delay-ms: 60000
    lookback-hours: 24
  enrichment:
    enabled: false
    interval-ms: 120000
    initial-delay-ms: 60000
    batch-size: 8
  llm:
    enabled: false
    api-key: test
    model: stub
    max-tokens: 200
    max-content-chars: 1000
  gnews:
    enabled: false
    api-key: test
    base-url: https://gnews.io/api/v4
    lang: en
    max-results: 10
